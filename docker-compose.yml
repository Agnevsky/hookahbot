services:
  bot:
    build: .
    container_name: hookah_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot_data:/app/data
    # Веб-приложение — только на localhost: наружу его выставляет
    # HTTPS-прокси (Caddy ниже или ваш nginx)
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-8080}:8080"
    environment:
      WEBAPP_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: hookah_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # HTTPS для веб-приложения: Telegram открывает Mini App только по https.
  # Caddy сам получает сертификат Let's Encrypt для WEBAPP_DOMAIN.
  # Запуск: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    container_name: hookah_caddy
    restart: unless-stopped
    profiles: ["https"]
    environment:
      WEBAPP_DOMAIN: ${WEBAPP_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - bot

volumes:
  postgres_data:
  bot_data:
  caddy_data:
